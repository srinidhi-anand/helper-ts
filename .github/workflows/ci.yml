name: CI

on:
  push:
    branches:
      - master
      - "feature/**"
      - bugfix/**
      - chore/**
  pull_request:
    branches:
      - master
      - "feature/**"

jobs:
  ci:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Generate docs
        run: npm run docs

      - name: Verify generated files are committed
        run: |
          git diff --exit-code README.md CHANGELOG.md docs || (
            echo "❌ Docs/README/CHANGELOG not committed"
            exit 1
          )

      # Upload docs as artifact
      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs
